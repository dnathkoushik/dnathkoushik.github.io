    <!--
      Applies the stored theme before first paint so the page never flashes the
      wrong background. Kept inline and tiny on purpose; ThemeProvider takes
      over once React mounts and uses the exact same storage key.
    -->
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('pos.theme')
          var mode = stored ? JSON.parse(stored) : 'system'
          var dark =
            mode === 'dark' ||
            (mode !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        } catch (e) {
          /* private mode / storage disabled — fall through to the light theme */
        }
      })()
    </script>
